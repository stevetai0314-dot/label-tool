<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e272e"/>
      <stop offset="100%" style="stop-color:#2d3436"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>

  <!-- Cat body (tuxedo black) -->
  <!-- Left ear -->
  <polygon points="72,82 52,28 102,68" fill="#222"/>
  <!-- Right ear -->
  <polygon points="184,82 204,28 154,68" fill="#222"/>
  <!-- Inner ear pink -->
  <polygon points="75,76 60,38 98,66" fill="#e17055"/>
  <polygon points="181,76 196,38 158,66" fill="#e17055"/>

  <!-- Head -->
  <ellipse cx="128" cy="115" rx="68" ry="65" fill="#222"/>

  <!-- White tuxedo chest (bib) -->
  <ellipse cx="128" cy="156" rx="32" ry="40" fill="#f0f0f0"/>
  <!-- White muzzle -->
  <ellipse cx="128" cy="128" rx="28" ry="22" fill="#f0f0f0"/>

  <!-- Eyes white -->
  <ellipse cx="104" cy="102" rx="16" ry="15" fill="white"/>
  <ellipse cx="152" cy="102" rx="16" ry="15" fill="white"/>
  <!-- Pupils -->
  <ellipse cx="106" cy="103" rx="10" ry="12" fill="#111"/>
  <ellipse cx="154" cy="103" rx="10" ry="12" fill="#111"/>
  <!-- Eye shine -->
  <circle cx="110" cy="99" r="4" fill="white"/>
  <circle cx="158" cy="99" r="4" fill="white"/>

  <!-- Nose -->
  <polygon points="128,122 122,129 134,129" fill="#fd79a8"/>
  <!-- Mouth -->
  <path d="M122 129 Q128 135 134 129" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="100" y1="126" x2="62" y2="118" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="100" y1="132" x2="62" y2="132" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="156" y1="126" x2="194" y2="118" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="156" y1="132" x2="194" y2="132" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scanner beam (green glow) -->
  <rect x="28" y="130" width="200" height="10" rx="5" fill="#00b894" opacity="0.25" filter="url(#glow)"/>
  <rect x="28" y="132" width="200" height="6" rx="3" fill="#00b894" opacity="0.9"/>
  <rect x="28" y="134" width="200" height="2" rx="1" fill="#55efc4"/>

  <!-- Barcode at bottom -->
  <rect x="34"  y="206" width="7"  height="28" rx="1" fill="#00b894"/>
  <rect x="45"  y="206" width="4"  height="28" rx="1" fill="#00b894"/>
  <rect x="53"  y="206" width="9"  height="28" rx="1" fill="#00b894"/>
  <rect x="66"  y="206" width="4"  height="28" rx="1" fill="#00b894"/>
  <rect x="74"  y="206" width="7"  height="28" rx="1" fill="#00b894"/>
  <rect x="85"  y="206" width="3"  height="28" rx="1" fill="#00b894"/>
  <rect x="92"  y="206" width="10" height="28" rx="1" fill="#00b894"/>
  <rect x="106" y="206" width="5"  height="28" rx="1" fill="#00b894"/>
  <rect x="115" y="206" width="7"  height="28" rx="1" fill="#00b894"/>
  <rect x="126" y="206" width="4"  height="28" rx="1" fill="#00b894"/>
  <rect x="134" y="206" width="9"  height="28" rx="1" fill="#00b894"/>
  <rect x="147" y="206" width="4"  height="28" rx="1" fill="#00b894"/>
  <rect x="155" y="206" width="7"  height="28" rx="1" fill="#00b894"/>
  <rect x="166" y="206" width="3"  height="28" rx="1" fill="#00b894"/>
  <rect x="173" y="206" width="10" height="28" rx="1" fill="#00b894"/>
  <rect x="187" y="206" width="5"  height="28" rx="1" fill="#00b894"/>
  <rect x="196" y="206" width="7"  height="28" rx="1" fill="#00b894"/>
  <rect x="207" y="206" width="3"  height="28" rx="1" fill="#00b894"/>
  <rect x="214" y="206" width="8"  height="28" rx="1" fill="#00b894"/>
</svg>
